{
  "name": "streamsense-lab",
  "services": {
    "zookeeper": {
      "image": "confluentinc/cp-zookeeper:7.6.1",
      "environment": {
        "ZOOKEEPER_CLIENT_PORT": 2181,
        "ZOOKEEPER_TICK_TIME": 2000
      },
      "volumes": [
        "../data/reliability_lab:/data",
        "../config:/config:ro"
      ]
    },
    "kafka": {
      "image": "confluentinc/cp-kafka:7.6.1",
      "depends_on": [
        "zookeeper"
      ],
      "environment": {
        "KAFKA_BROKER_ID": 1,
        "KAFKA_ZOOKEEPER_CONNECT": "zookeeper:2181",
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT",
        "KAFKA_ADVERTISED_LISTENERS": "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:39092",
        "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR": 1,
        "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR": 1,
        "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR": 1,
        "KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS": 0,
        "KAFKA_AUTO_CREATE_TOPICS_ENABLE": "true"
      },
      "volumes": [
        "../data/reliability_lab:/data",
        "../config:/config:ro"
      ],
      "ports": [
        "39092:39092"
      ]
    },
    "topic-init": {
      "image": "confluentinc/cp-kafka:7.6.1",
      "depends_on": [
        "kafka"
      ],
      "environment": {
        "AUDIO_TOPIC": "${AUDIO_TOPIC:-audio-segment}",
        "TRANSCRIPT_TOPIC": "${TRANSCRIPT_TOPIC:-transcription-result}",
        "KEYWORD_TOPIC": "${KEYWORD_TOPIC:-keyword-event}",
        "HOTWORD_UPDATE_TOPIC": "${HOTWORD_UPDATE_TOPIC:-streamsense.hotword.updates}",
        "FAILED_TOPIC": "${FAILED_TOPIC:-transcription-failed}",
        "LOG_DIR": "/tmp"
      },
      "command": "bash -lc \"export LOG_DIR=/tmp && cub kafka-ready -b kafka:9092 1 90 && kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic $$AUDIO_TOPIC --partitions 3 --replication-factor 1 && kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic $$TRANSCRIPT_TOPIC --partitions 3 --replication-factor 1 && kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic $$KEYWORD_TOPIC --partitions 3 --replication-factor 1 && kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic $$HOTWORD_UPDATE_TOPIC --partitions 3 --replication-factor 1 && kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic $$FAILED_TOPIC --partitions 3 --replication-factor 1\"\n",
      "restart": "no",
      "volumes": [
        "../data/reliability_lab:/data",
        "../config:/config:ro"
      ]
    },
    "redis": {
      "image": "redis:7-alpine",
      "command": [
        "redis-server",
        "--appendonly",
        "yes"
      ],
      "volumes": [
        "redis-data:/data"
      ]
    },
    "asr": {
      "build": {
        "context": "../services/asr"
      },
      "gpus": "all",
      "environment": {
        "KAFKA_BOOTSTRAP_SERVERS": "kafka:9092",
        "HOTWORD_UPDATE_TOPIC": "",
        "ASR_MODEL": "small",
        "ASR_MODEL_PATH": "${LAB_ASR_MODEL_PATH:-}",
        "ASR_MODEL_CACHE": "/models",
        "HF_HUB_DISABLE_XET": "${HF_HUB_DISABLE_XET:-1}",
        "HF_HUB_ENABLE_HF_TRANSFER": "${HF_HUB_ENABLE_HF_TRANSFER:-1}",
        "ASR_DEVICE": "${ASR_DEVICE:-cuda}",
        "ASR_COMPUTE_TYPE": "${ASR_COMPUTE_TYPE:-float16}",
        "ASR_LANGUAGE": "${ASR_LANGUAGE:-zh}",
        "ASR_PRELOAD": "${ASR_PRELOAD:-true}",
        "ASR_SIMPLIFIED_CHINESE": "${ASR_SIMPLIFIED_CHINESE:-true}",
        "ASR_BEAM_SIZE": "${ASR_BEAM_SIZE:-5}",
        "ASR_BEST_OF": "${ASR_BEST_OF:-5}",
        "ASR_USE_CONTEXT": "false",
        "ASR_CONTEXT_CHARS": "${ASR_CONTEXT_CHARS:-60}",
        "ASR_ENABLE_VAD": "${ASR_ENABLE_VAD:-true}",
        "ASR_ENABLE_ENERGY_FILTER": "${ASR_ENABLE_ENERGY_FILTER:-true}",
        "ASR_ENERGY_THRESHOLD_DBFS": "${ASR_ENERGY_THRESHOLD_DBFS:--42}",
        "ASR_CONDITION_ON_PREVIOUS_TEXT": "${ASR_CONDITION_ON_PREVIOUS_TEXT:-false}",
        "ASR_REPETITION_PENALTY": "${ASR_REPETITION_PENALTY:-1.05}",
        "ASR_NO_REPEAT_NGRAM_SIZE": "${ASR_NO_REPEAT_NGRAM_SIZE:-3}",
        "ASR_COMPRESSION_RATIO_THRESHOLD": "${ASR_COMPRESSION_RATIO_THRESHOLD:-2.2}",
        "ASR_LOG_PROB_THRESHOLD": "${ASR_LOG_PROB_THRESHOLD:--1.0}",
        "ASR_NO_SPEECH_THRESHOLD": "${ASR_NO_SPEECH_THRESHOLD:-0.6}",
        "ASR_SKIP_NO_SPEECH_PROB": "${ASR_SKIP_NO_SPEECH_PROB:-0.65}",
        "ASR_SKIP_AVG_LOGPROB_BELOW": "${ASR_SKIP_AVG_LOGPROB_BELOW:--0.85}",
        "ASR_HALLUCINATION_SILENCE_THRESHOLD": "${ASR_HALLUCINATION_SILENCE_THRESHOLD:-1.0}",
        "ASR_FILTER_REPETITION": "${ASR_FILTER_REPETITION:-true}",
        "ASR_HALLUCINATION_PATTERNS": "${ASR_HALLUCINATION_PATTERNS:-\u8bf7\u4e0d\u541d\u70b9\u8d5e|\u70b9\u8d5e\u8ba2\u9605|\u8ba2\u9605\u8f6c\u53d1|\u6253\u8d4f\u652f\u6301|\u611f\u8c22\u89c2\u770b|\u8bf7\u9010\u5b57\u51c6\u786e\u8f6c\u5199\u771f\u5b9e\u8bed\u97f3|\u4e0d\u8981\u603b\u7ed3|\u4e0d\u8981\u91cd\u590d\u65e0\u58f0\u5185\u5bb9}",
        "ASR_INITIAL_PROMPT": "${ASR_INITIAL_PROMPT:-\u666e\u901a\u8bdd\u4e2d\u6587\u97f3\u9891\uff0c\u8f93\u51fa\u7b80\u4f53\u4e2d\u6587\u5b57\u5e55\u3002}",
        "ASR_HOTWORDS": "${ASR_HOTWORDS:-}",
        "ASR_MAX_HOTWORDS": "${ASR_MAX_HOTWORDS:-120}",
        "ASR_SUBTITLE_SKIP_NO_SPEECH_PROB": "${ASR_SUBTITLE_SKIP_NO_SPEECH_PROB:-0.88}",
        "ASR_SUBTITLE_SKIP_AVG_LOGPROB_BELOW": "${ASR_SUBTITLE_SKIP_AVG_LOGPROB_BELOW:--1.20}",
        "ASR_VAD_MIN_SILENCE_MS": "${ASR_VAD_MIN_SILENCE_MS:-300}"
      },
      "volumes": [
        "../data/reliability_lab:/data",
        "../config:/config:ro",
        "../models:/models",
        "../services/asr/asr_service.py:/app/asr_service.py:ro",
        "../services/asr/runtime_metrics.py:/app/runtime_metrics.py:ro"
      ],
      "restart": "unless-stopped",
      "image": "${LAB_ASR_IMAGE:-streamsense-lab-asr}",
      "ports": [
        "18001:8000"
      ]
    },
    "api": {
      "build": {
        "context": "../services/api"
      },
      "depends_on": {
        "topic-init": {
          "condition": "service_completed_successfully"
        },
        "redis": {
          "condition": "service_started"
        }
      },
      "environment": {
        "KAFKA_BOOTSTRAP_SERVERS": "kafka:9092",
        "TRANSCRIPT_TOPIC": "${TRANSCRIPT_TOPIC:-transcription-result}",
        "KEYWORD_TOPIC": "${KEYWORD_TOPIC:-keyword-event}",
        "HOTWORD_UPDATE_TOPIC": "${HOTWORD_UPDATE_TOPIC:-streamsense.hotword.updates}",
        "REDIS_URL": "redis://redis:6379/0",
        "CUSTOM_KEYWORD_FILE": "/config/custom_keywords.txt",
        "ASR_CORRECTION_FILE": "/config/asr_corrections.txt",
        "RESULT_DIR": "/data/results",
        "TOPIC_SHIFT_THRESHOLD": "0.35",
        "HOTWORD_AUTO_DISCOVERY_ENABLED": "${HOTWORD_AUTO_DISCOVERY_ENABLED:-true}",
        "HOTWORD_DISCOVERY_TOP_K": "${HOTWORD_DISCOVERY_TOP_K:-30}",
        "HOTWORD_AUTO_ADD_MIN_COUNT": "${HOTWORD_AUTO_ADD_MIN_COUNT:-5}",
        "HOTWORD_MAX_WORDS": "${HOTWORD_MAX_WORDS:-120}",
        "HOTWORD_MIN_TRANSCRIPT_LOGPROB": "${HOTWORD_MIN_TRANSCRIPT_LOGPROB:--0.55}",
        "HOTWORD_USE_STATIC_HINTS": "${HOTWORD_USE_STATIC_HINTS:-false}",
        "SENTENCE_BUFFER_ENABLED": "${SENTENCE_BUFFER_ENABLED:-true}",
        "SENTENCE_MAX_CHARS": "${SENTENCE_MAX_CHARS:-110}",
        "SENTENCE_FLUSH_GAP_MS": "${SENTENCE_FLUSH_GAP_MS:-1500}",
        "SENTENCE_STALE_FLUSH_MS": "${SENTENCE_STALE_FLUSH_MS:-3000}",
        "SENTENCE_ADD_PERIOD_ON_FLUSH": "${SENTENCE_ADD_PERIOD_ON_FLUSH:-true}",
        "SENTENCE_DROP_INCOMPLETE_ON_FLUSH": "${SENTENCE_DROP_INCOMPLETE_ON_FLUSH:-false}",
        "SENTENCE_MARK_INCOMPLETE_ON_FLUSH": "${SENTENCE_MARK_INCOMPLETE_ON_FLUSH:-true}",
        "SENTENCE_INCOMPLETE_ENDINGS": "${SENTENCE_INCOMPLETE_ENDINGS:-\u56e0\u4e3a|\u6240\u4ee5|\u4f46\u662f|\u7136\u800c|\u5e76\u4e14|\u4ee5\u53ca|\u5982\u679c|\u867d\u7136|\u6216\u8005|\u5e76\u4e0d\u662f|\u6362\u53e5\u8bdd\u8bf4|\u6bd4\u5982|\u4f8b\u5982|\u9996\u5148|\u5176\u6b21}",
        "STREAMSENSE_DB_PATH": "${STREAMSENSE_DB_PATH:-/data/results/streamsense.db}",
        "METRICS_HISTORY_INTERVAL_SECONDS": "${METRICS_HISTORY_INTERVAL_SECONDS:-5}",
        "METRICS_HISTORY_MAX_POINTS": "${METRICS_HISTORY_MAX_POINTS:-720}"
      },
      "volumes": [
        "../data/reliability_lab:/data",
        "../config:/config:ro",
        "../services/api/app.py:/app/app.py:ro",
        "../services/api/storage.py:/app/storage.py:ro"
      ],
      "restart": "unless-stopped",
      "image": "${LAB_API_IMAGE:-streamsense-lab-api}",
      "ports": [
        "18000:8000"
      ]
    },
    "flink-jobmanager": {
      "build": {
        "context": "../flink"
      },
      "command": "jobmanager",
      "environment": {
        "FLINK_PROPERTIES": "jobmanager.rpc.address: flink-jobmanager\nparallelism.default: 1\ntaskmanager.numberOfTaskSlots: 2\n\nrestart-strategy: fixed-delay\nrestart-strategy.fixed-delay.attempts: 10\nrestart-strategy.fixed-delay.delay: 2 s\n",
        "FLINK_CHECKPOINT_INTERVAL_MS": "5000",
        "FLINK_CHECKPOINT_STORAGE": "file:///data/checkpoints",
        "ASR_TIMEOUT_SECONDS": "10"
      },
      "volumes": [
        "../data/reliability_lab:/data",
        "../config:/config:ro",
        "../flink/transcription_job.py:/opt/flink/usrlib/transcription_job.py:ro"
      ],
      "image": "${LAB_FLINK_JOBMANAGER_IMAGE:-streamsense-lab-flink-jobmanager}",
      "ports": [
        "18081:8081"
      ]
    },
    "flink-taskmanager": {
      "build": {
        "context": "../flink"
      },
      "depends_on": [
        "flink-jobmanager"
      ],
      "command": "taskmanager",
      "environment": {
        "FLINK_PROPERTIES": "jobmanager.rpc.address: flink-jobmanager\nparallelism.default: 1\ntaskmanager.numberOfTaskSlots: 2\n\nrestart-strategy: fixed-delay\nrestart-strategy.fixed-delay.attempts: 10\nrestart-strategy.fixed-delay.delay: 2 s\n",
        "FLINK_CHECKPOINT_INTERVAL_MS": "5000",
        "FLINK_CHECKPOINT_STORAGE": "file:///data/checkpoints",
        "ASR_TIMEOUT_SECONDS": "10"
      },
      "volumes": [
        "../data/reliability_lab:/data",
        "../config:/config:ro",
        "../flink/transcription_job.py:/opt/flink/usrlib/transcription_job.py:ro"
      ],
      "image": "${LAB_FLINK_TASKMANAGER_IMAGE:-streamsense-lab-flink-taskmanager}"
    },
    "flink-job-submitter": {
      "build": {
        "context": "../flink"
      },
      "depends_on": {
        "topic-init": {
          "condition": "service_completed_successfully"
        },
        "asr": {
          "condition": "service_started"
        },
        "flink-jobmanager": {
          "condition": "service_started"
        },
        "flink-taskmanager": {
          "condition": "service_started"
        }
      },
      "environment": {
        "KAFKA_BOOTSTRAP_SERVERS": "kafka:9092",
        "AUDIO_TOPIC": "${AUDIO_TOPIC:-audio-segment}",
        "TRANSCRIPT_TOPIC": "${TRANSCRIPT_TOPIC:-transcription-result}",
        "FAILED_TOPIC": "${FAILED_TOPIC:-transcription-failed}",
        "ASR_URL": "http://asr:8000",
        "ASR_TIMEOUT_SECONDS": "10",
        "ASR_RETRY_TIMES": "${ASR_RETRY_TIMES:-2}",
        "ASR_RETRY_BACKOFF_MS": "${ASR_RETRY_BACKOFF_MS:-800}",
        "FLINK_JOB_PARALLELISM": "${FLINK_JOB_PARALLELISM:-1}",
        "FLINK_CHECKPOINT_INTERVAL_MS": "5000",
        "FLINK_CHECKPOINT_STORAGE": "file:///data/checkpoints"
      },
      "volumes": [
        "../data/reliability_lab:/data",
        "../config:/config:ro",
        "../flink/transcription_job.py:/opt/flink/usrlib/transcription_job.py:ro"
      ],
      "command": "bash -lc \"bash /opt/flink/usrlib/wait-for.sh kafka 9092 && bash /opt/flink/usrlib/wait-for.sh asr 8000 && bash /opt/flink/usrlib/wait-for.sh flink-jobmanager 8081 && flink run -m flink-jobmanager:8081 -py /opt/flink/usrlib/transcription_job.py\"\n",
      "restart": "no",
      "image": "${LAB_FLINK_JOB_SUBMITTER_IMAGE:-streamsense-lab-flink-job-submitter}"
    }
  },
  "volumes": {
    "redis-data": {}
  }
}