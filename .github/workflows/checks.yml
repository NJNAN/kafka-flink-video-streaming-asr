name: Reliability checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q services flink tools
      - run: python -m tools.reliability_report --check
      - run: docker compose -f experiments/compose.lab.yaml config --quiet
